<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Ticket Check-in</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f3f4f6;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      background: white;

      border-radius: 15px;

      overflow: hidden;

    }


    #result {

      max-width: 500px;

      margin: 20px auto;

      padding: 20px;

      background: white;

      border-radius: 15px;

      font-size: 18px;

    }


    .success {

      color: #16803c;

    }


    .error {

      color: #d00000;

    }


    .waiting {

      color: #555;

    }

  </style>

</head>


<body>


  <h1>🎫 E-Ticket Check-in</h1>

  <p>สแกน QR Code บัตรเข้างาน</p>


  <div id="reader"></div>


  <div id="result"
       class="waiting">

    📷 กำลังเตรียมกล้อง...

  </div>



<script>


// ==========================================
// Google Apps Script Web App
// ==========================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyOs7oQf99Zrfyofg_WE2ss0FM1V3Zb5CAYdJ1GCwXnLomCmD1eDp-On2GHu4RHEXC9yg/exec";



let scanning = true;



// ==========================================
// QR SCAN SUCCESS
// ==========================================

function onScanSuccess(decodedText) {


  if (!scanning) {

    return;

  }


  scanning = false;


  document.getElementById("result").innerHTML =

    "⏳ กำลังตรวจสอบ Ticket...";



  let ticketID = decodedText;



  // ========================================
  // ดึง Ticket ID จาก QR Text
  // ========================================

  const match =
    decodedText.match(
      /Ticket ID:\s*([A-Za-z0-9_-]+)/
    );


  if (match) {

    ticketID = match[1];

  }



  // ========================================
  // ส่งไป Apps Script
  // ========================================

  checkIn(ticketID);

}



// ==========================================
// ส่ง Ticket ไป Apps Script
// ใช้ JSONP แทน fetch()
// เพื่อไม่ติด CORS
// ==========================================

function checkIn(ticketID) {


  const callbackName =
    "checkInCallback_" +
    Date.now();



  // ========================================
  // สร้าง callback
  // ========================================

  window[callbackName] =
    function(result) {


      try {

        showResult(result);

      } catch (error) {

        document.getElementById("result").innerHTML =

          "<div class='error'>" +

          "<h2>❌ เกิดข้อผิดพลาด</h2>" +

          "<p>" +
          error.message +
          "</p>" +

          "</div>";

      }



      // ====================================
      // ลบ callback
      // ====================================

      delete window[callbackName];



      // ====================================
      // พร้อมสแกนใบถัดไป
      // ====================================

      setTimeout(function() {

        scanning = true;

        document.getElementById("result").innerHTML =

          "📷 พร้อมสแกนใบถัดไป";

      }, 3000);

    };



  // ========================================
  // สร้าง URL
  // ========================================

  const url =

    API_URL +

    "?ticketID=" +

    encodeURIComponent(ticketID) +

    "&callback=" +

    encodeURIComponent(callbackName);



  // ========================================
  // สร้าง Script
  // ========================================

  const script =
    document.createElement("script");


  script.src = url;



  // ========================================
  // ถ้าเชื่อมต่อไม่ได้
  // ========================================

  script.onerror =
    function() {


      delete window[callbackName];


      document.getElementById("result").innerHTML =

        "<div class='error'>" +

        "<h2>❌ เชื่อมต่อระบบไม่ได้</h2>" +

        "<p>ไม่สามารถเชื่อมต่อ Google Apps Script</p>" +

        "</div>";



      setTimeout(function() {

        scanning = true;

        document.getElementById("result").innerHTML =

          "📷 พร้อมสแกนใบถัดไป";

      }, 3000);

    };



  document.body.appendChild(script);

}



// ==========================================
// แสดงผลการ Check-in
// ==========================================

function showResult(result) {


  // ========================================
  // CHECK-IN สำเร็จ
  // ========================================

  if (result.success) {


    document.getElementById("result").innerHTML =

      "<div class='success'>" +

      "<h2>✅ CHECK-IN สำเร็จ</h2>" +

      "<p><b>Ticket:</b> " +

      result.ticketID +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      result.customer +

      "</p>" +

      "<p><b>Zone:</b> " +

      result.zone +

      "</p>" +

      "<p><b>Order:</b> " +

      result.orderID +

      "</p>" +

      "</div>";


    return;

  }



  // ========================================
  // Ticket ถูกใช้แล้ว
  // ========================================

  if (result.alreadyUsed) {


    document.getElementById("result").innerHTML =

      "<div class='error'>" +

      "<h2>⚠️ ใช้บัตรไปแล้ว</h2>" +

      "<p><b>Ticket:</b> " +

      result.ticketID +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      result.customer +

      "</p>" +

      "<p><b>Zone:</b> " +

      result.zone +

      "</p>" +

      "<p>" +

      (result.message || "") +

      "</p>" +

      "</div>";


    return;

  }



  // ========================================
  // ไม่พบ Ticket
  // ========================================

  document.getElementById("result").innerHTML =

    "<div class='error'>" +

    "<h2>❌ ไม่พบ Ticket</h2>" +

    "<p>" +

    (result.message ||

     "ไม่พบข้อมูล Ticket") +

    "</p>" +

    "</div>";

}



// ==========================================
// QR Scan Failure
// ==========================================

function onScanFailure(error) {

  // ไม่ต้องแสดงอะไร

}



// ==========================================
// เปิด QR Scanner
// ==========================================

const scanner =

  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    },

    false

  );



scanner.render(

  onScanSuccess,

  onScanFailure

);


</script>


</body>

</html>
