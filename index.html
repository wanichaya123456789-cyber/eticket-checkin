<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>E-Ticket Check-In</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #555;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  border-radius: 15px;
  overflow: hidden;
}

#result {
  width: 100%;
  max-width: 500px;
  box-sizing: border-box;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 15px;
  font-size: 18px;
}

.success {
  color: #16803c;
}

.error {
  color: #d00000;
}

.warning {
  color: #b26a00;
}

button {
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
  background: #1976d2;
  color: white;
}

button:disabled {
  background: #999;
}

</style>

</head>

<body>

<h1>🎫 E-Ticket Check-In</h1>

<div class="subtitle">
  สแกน QR Code บัตรเข้างาน
</div>

<button
  id="startButton"
  onclick="startScanner()">

  📷 เปิดกล้อง

</button>

<div id="reader"></div>

<div id="result">

  📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน

</div>


<script>


// ======================================================
// GOOGLE APPS SCRIPT WEB APP
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyOs7oQf99Zrfyofg_WE2ss0FM1V3Zb5CAYdJ1GCwXnLomCmD1eDp-On2GHu4RHEXC9yg/exec";
// ======================================================
// ตัวแปร Scanner
// ======================================================

let scanner = null;

let scannerStarted = false;

let scanning = true;


// ======================================================
// เปิดกล้อง
// ======================================================

function startScanner() {

  if (scannerStarted) {

    return;

  }


  const button =
    document.getElementById(
      "startButton"
    );


  button.disabled = true;

  button.innerText =
    "⏳ กำลังเปิดกล้อง...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scannerStarted = true;

    scanning = true;


    button.innerText =
      "📷 กล้องกำลังทำงาน";


    document.getElementById(
      "result"
    ).innerHTML =

      "📷 พร้อมสแกนบัตร";


  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );


    button.disabled = false;

    button.innerText =
      "📷 เปิดกล้อง";


    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='error'>" +

      "<h3>❌ เปิดกล้องไม่ได้</h3>" +

      "<p>" +

      escapeHtml(
        error.message ||
        String(error)
      ) +

      "</p>" +

      "</div>";

  });

}


// ======================================================
// QR SCAN SUCCESS
// ======================================================

function onScanSuccess(decodedText) {

  if (!scanning) {

    return;

  }


  scanning = false;


  document.getElementById(
    "result"
  ).innerHTML =

    "⏳ กำลังตรวจสอบ Ticket...";


  // ====================================================
  // อ่านข้อความ QR
  // ====================================================

  let ticketID =
    String(
      decodedText || ""
    ).trim();


  console.log(
    "QR Text:",
    ticketID
  );


  // ====================================================
  // ดึง Ticket ID
  //
  // รองรับ:
  //
  // Ticket ID: WPF2026000027
  //
  // ====================================================

  const match =
    ticketID.match(
      /Ticket ID:\s*([A-Za-z0-9_-]+)/
    );


  if (match) {

    ticketID =
      match[1];

  }


  ticketID =
    ticketID.trim();


  console.log(
    "Ticket ID:",
    ticketID
  );


  // ====================================================
  // ตรวจ Ticket ID
  // ====================================================

  if (!ticketID) {

    showResult({

      success: false,

      alreadyUsed: false,

      message:
        "ไม่สามารถอ่าน Ticket ID จาก QR Code ได้"

    });


    resetScanner();

    return;

  }


  // ====================================================
  // สร้าง JSONP Callback
  // ====================================================

  const callbackName =
    "checkInCallback_" +
    Date.now();


  // ====================================================
  // สร้างฟังก์ชันรับผลจาก Apps Script
  // ====================================================

  window[callbackName] =
    function(result) {

      console.log(
        "Apps Script Result:",
        result
      );


      showResult(result);


      // ลบ callback

      try {

        delete window[callbackName];

      }

      catch(error) {

        console.error(error);

      }


      // เตรียมสแกนใบต่อไป

      setTimeout(
        function() {

          scanning = true;

          document.getElementById(
            "result"
          ).innerHTML =

            "📷 พร้อมสแกนบัตรใบถัดไป";

        },
        3000
      );

    };


  // ====================================================
  // สร้าง Script
  // ====================================================

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  // ====================================================
  // URL API
  // ====================================================

  script.src =

    API_URL +

    "?ticketID=" +

    encodeURIComponent(
      ticketID
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  console.log(
    "API URL:",
    script.src
  );


  // ====================================================
  // กรณีเชื่อมต่อไม่ได้
  // ====================================================

  script.onerror =
    function() {

      console.error(
        "Apps Script API connection failed"
      );


      try {

        delete window[callbackName];

      }

      catch(error) {

        console.error(error);

      }


      script.remove();


      document.getElementById(
        "result"
      ).innerHTML =

        "<div class='error'>" +

        "<h2>❌ เชื่อมต่อระบบไม่ได้</h2>" +

        "<p>" +

        "ไม่สามารถเชื่อมต่อ Google Apps Script ได้" +

        "</p>" +

        "<p>" +

        "กรุณาตรวจสอบ Web App" +

        "</p>" +

        "</div>";


      setTimeout(
        function() {

          scanning = true;

        },
        3000
      );

    };


  // ====================================================
  // ส่ง Request
  // ====================================================

  document.body.appendChild(
    script
  );

}


// ======================================================
// แสดงผล Check-In
// ======================================================

function showResult(result) {


  if (!result) {

    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='error'>" +

      "<h2>❌ ไม่ได้รับข้อมูล</h2>" +

      "</div>";

    return;

  }


  // ====================================================
  // CHECK-IN สำเร็จ
  // ====================================================

  if (result.success) {

    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='success'>" +

      "<h2>✅ CHECK-IN สำเร็จ</h2>" +

      "<p><b>Ticket:</b> " +

      escapeHtml(
        result.ticketID
      ) +

      "</p>" +

      "<p><b>Order:</b> " +

      escapeHtml(
        result.orderID
      ) +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      escapeHtml(
        result.customer
      ) +

      "</p>" +

      "<p><b>Zone:</b> " +

      escapeHtml(
        result.zone
      ) +

      "</p>" +

      "<p><b>ประเภท:</b> " +

      escapeHtml(
        result.ticketType
      ) +

      "</p>" +

      "</div>";

    return;

  }


  // ====================================================
  // ใช้ Ticket ไปแล้ว
  // ====================================================

  if (result.alreadyUsed) {

    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='warning'>" +

      "<h2>⚠️ ใช้บัตรไปแล้ว</h2>" +

      "<p><b>Ticket:</b> " +

      escapeHtml(
        result.ticketID
      ) +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      escapeHtml(
        result.customer
      ) +

      "</p>" +

      "<p><b>Zone:</b> " +

      escapeHtml(
        result.zone
      ) +

      "</p>" +

      "<p>" +

      escapeHtml(
        result.message
      ) +

      "</p>" +

      "</div>";

    return;

  }


  // ====================================================
  // ไม่พบ Ticket
  // ====================================================

  document.getElementById(
    "result"
  ).innerHTML =

    "<div class='error'>" +

    "<h2>❌ ไม่พบ Ticket</h2>" +

    "<p>" +

    escapeHtml(

      result.message ||

      "ไม่พบ Ticket ในระบบ"

    ) +

    "</p>" +

    "</div>";

}


// ======================================================
// ป้องกัน HTML Injection
// ======================================================

function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


// ======================================================
// เตรียมสแกนใหม่
// ======================================================

function resetScanner() {

  setTimeout(
    function() {

      scanning = true;

      document.getElementById(
        "result"
      ).innerHTML =

        "📷 พร้อมสแกนบัตร";

    },
    3000
  );

}


// ======================================================
// QR Scan Failure
// ======================================================

function onScanFailure(error) {

  // ไม่ต้องแสดงข้อความ
  // ฟังก์ชันนี้ถูกเรียกบ่อย
  // ขณะกล้องกำลังค้นหา QR

}


</script>

</body>

</html>
