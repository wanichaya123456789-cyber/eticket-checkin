```html
<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>E-Ticket Check-In</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 20px;

  font-family:
    Arial,
    sans-serif;

  background:
    #f3f4f6;

  text-align: center;

}


h1 {

  margin:
    10px 0 5px;

}


.subtitle {

  color:
    #555;

  margin-bottom:
    20px;

}


#reader {

  width:
    100%;

  max-width:
    500px;

  margin:
    20px auto;

  background:
    white;

  border-radius:
    15px;

  overflow:
    hidden;

}


#result {

  width:
    100%;

  max-width:
    500px;

  margin:
    20px auto;

  padding:
    20px;

  background:
    white;

  border-radius:
    15px;

  font-size:
    18px;

  min-height:
    100px;

}


button {

  padding:
    14px 25px;

  border:
    none;

  border-radius:
    10px;

  font-size:
    17px;

  cursor:
    pointer;

  background:
    #1976d2;

  color:
    white;

}


button:disabled {

  background:
    #999;

}


.success {

  color:
    #16803c;

}


.error {

  color:
    #d00000;

}


.warning {

  color:
    #b26a00;

}


.info {

  color:
    #555;

}


</style>

</head>


<body>


<h1>
🎫 E-Ticket Check-In
</h1>


<div class="subtitle">
ระบบ E-Ticket Check-in คาราบาว & โลโซ
</div>


<button
  id="startButton"
  onclick="startScanner()"
>

📷 เปิดกล้อง

</button>


<div id="reader"></div>


<div id="result">

📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน

</div>


<script>


/**
 * ==========================================
 * Apps Script Web App URL
 * ==========================================
 */

const API_URL =
"https://script.google.com/macros/s/AKfycbyjiCHZIxRHyWMLwNeE5roElVrDVJctOn25y6eA3tr32mWuqwLqE_3hWnDtk6zpaurO-A/exec";


let scanner = null;

let scannerStarted = false;

let scanning = true;


/**
 * ==========================================
 * เปิดกล้อง
 * ==========================================
 */

function startScanner() {


  const button =
    document.getElementById(
      "startButton"
    );


  if (scannerStarted) {

    return;

  }


  button.disabled =
    true;


  button.innerText =
    "⏳ กำลังเปิดกล้อง...";


  document.getElementById(
    "result"
  ).innerHTML =

    "<div class='info'>" +

    "📷 กำลังขอสิทธิ์ใช้กล้อง..." +

    "</div>";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner

    .start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      onScanFailure

    )

    .then(function() {


      scannerStarted =
        true;


      scanning =
        true;


      button.innerText =
        "📷 กล้องกำลังทำงาน";


      document.getElementById(
        "result"
      ).innerHTML =

        "<div class='info'>" +

        "📷 พร้อมสแกนบัตร" +

        "</div>";


    })

    .catch(function(error) {


      console.error(
        "Camera error:",
        error
      );


      button.disabled =
        false;


      button.innerText =
        "📷 เปิดกล้อง";


      document.getElementById(
        "result"
      ).innerHTML =

        "<div class='error'>" +

        "<h3>❌ เปิดกล้องไม่ได้</h3>" +

        "<p>" +

        escapeHtml(
          error
        ) +

        "</p>" +

        "<p>" +

        "กรุณาอนุญาตให้เบราว์เซอร์ใช้กล้อง" +

        "</p>" +

        "</div>";

    });

}


/**
 * ==========================================
 * QR Scan สำเร็จ
 * ==========================================
 */

function onScanSuccess(
  decodedText
) {


  if (!scanning) {

    return;

  }


  scanning =
    false;


  document.getElementById(
    "result"
  ).innerHTML =

    "<div class='info'>" +

    "⏳ กำลังตรวจสอบ Ticket..." +

    "</div>";


  // ========================================
  // อ่านข้อความจาก QR
  // ========================================

  let ticketID =
    String(
      decodedText || ""
    ).trim();


  // ========================================
  // ถ้า QR เป็นรูปแบบ:
  //
  // เสก โลโซ & คาราบาว
  // Ticket ID: WPF2026000001
  // Order ID: ORD2026000001
  // ========================================

  const match =
    ticketID.match(
      /Ticket\s*ID\s*:\s*([A-Za-z0-9_-]+)/i
    );


  if (match) {

    ticketID =
      match[1];

  }


  // ========================================
  // ส่งไป Apps Script
  // ========================================

  checkInTicket(
    ticketID
  );

}


/**
 * ==========================================
 * ส่ง Ticket ID ไป Apps Script
 * ใช้ JSONP
 * ==========================================
 */

function checkInTicket(
  ticketID
) {


  const callbackName =
    "checkInCallback_" +
    Date.now();


  // ========================================
  // สร้าง Callback
  // ========================================

  window[callbackName] =
    function(result) {


      try {

        showResult(
          result
        );


      } finally {


        delete window[
          callbackName
        ];


        const script =
          document.getElementById(
            callbackName
          );


        if (script) {

          script.remove();

        }


        // ==================================
        // พร้อมสแกนใบต่อไป
        // ==================================

        setTimeout(
          function() {

            scanning =
              true;


            document.getElementById(
              "result"
            ).innerHTML =

              "<div class='info'>" +

              "📷 พร้อมสแกนบัตรใบถัดไป" +

              "</div>";

          },
          3000
        );

      }

    };


  // ========================================
  // สร้าง Script JSONP
  // ========================================

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  // ========================================
  // สร้าง URL
  // ========================================

  script.src =
    API_URL +

    "?ticketID=" +

    encodeURIComponent(
      ticketID
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  // ========================================
  // กรณีเชื่อมต่อไม่ได้
  // ========================================

  script.onerror =
    function() {


      delete window[
        callbackName
      ];


      script.remove();


      document.getElementById(
        "result"
      ).innerHTML =

        "<div class='error'>" +

        "<h2>❌ เชื่อมต่อระบบไม่ได้</h2>" +

        "<p>" +

        "ไม่สามารถเชื่อมต่อ Google Apps Script" +

        "</p>" +

        "</div>";


      setTimeout(
        function() {

          scanning =
            true;

        },
        3000
      );

    };


  // ========================================
  // ส่งคำขอ
  // ========================================

  document.body.appendChild(
    script
  );

}


/**
 * ==========================================
 * แสดงผล
 * ==========================================
 */

function showResult(
  result
) {


  // ========================================
  // สำเร็จ
  // ========================================

  if (
    result.success
  ) {


    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='success'>" +

      "<h2>✅ CHECK-IN สำเร็จ</h2>" +

      "<p><b>Ticket:</b> " +

      escapeHtml(
        result.ticketID
      ) +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      escapeHtml(
        result.customer
      ) +

      "</p>" +

      "<p><b>Zone:</b> " +

      escapeHtml(
        result.zone
      ) +

      "</p>" +

      "<p><b>ประเภท:</b> " +

      escapeHtml(
        result.ticketType
      ) +

      "</p>" +

      "</div>";

    return;

  }


  // ========================================
  // ใช้ไปแล้ว
  // ========================================

  if (
    result.alreadyUsed
  ) {


    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='warning'>" +

      "<h2>⚠️ บัตรนี้ใช้ไปแล้ว</h2>" +

      "<p><b>Ticket:</b> " +

      escapeHtml(
        result.ticketID
      ) +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      escapeHtml(
        result.customer
      ) +

      "</p>" +

      "<p><b>Zone:</b> " +

      escapeHtml(
        result.zone
      ) +

      "</p>" +

      "</div>";

    return;

  }


  // ========================================
  // ไม่พบ Ticket
  // ========================================

  document.getElementById(
    "result"
  ).innerHTML =

    "<div class='error'>" +

    "<h2>❌ ไม่พบ Ticket</h2>" +

    "<p>" +

    escapeHtml(
      result.message ||
      "ไม่พบ Ticket ในระบบ"
    ) +

    "</p>" +

    "<p><b>Ticket:</b> " +

    escapeHtml(
      result.ticketID ||
      "-"
    ) +

    "</p>" +

    "</div>";

}


/**
 * ==========================================
 * ป้องกัน HTML Injection
 * ==========================================
 */

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/**
 * ==========================================
 * Scanner Error
 * ==========================================
 */

function onScanFailure(
  error
) {

  // ไม่ต้องแสดงอะไร

}

</script>


</body>

</html>
