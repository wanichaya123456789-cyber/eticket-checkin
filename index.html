<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>E-Ticket Check-In</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      font-size: 18px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d00000;
    }

    .warning {
      color: #b26a00;
    }

    .loading {
      color: #555;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    button:disabled {
      background: #999;
    }

  </style>

</head>


<body>

  <h1>🎫 E-Ticket Check-In</h1>

  <div class="subtitle">
    สแกน QR Code บัตรเข้างาน
  </div>


  <button
    id="startButton"
    onclick="startScanner()">

    📷 เปิดกล้อง

  </button>


  <div id="reader"></div>


  <div id="result">

    📷 กด "เปิดกล้อง" เพื่อเริ่มสแกน

  </div>


<script>


/* =====================================================
   Google Apps Script Web App
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyOs7oQf99Zrfyofg_WE2ss0FM1V3Zb5CAYdJ1GCwXnLomCmD1eDp-On2GHu4RHEXC9yg/exec";


/* =====================================================
   ตัวแปรระบบ
   ===================================================== */

let scanner = null;

let scannerStarted = false;

let scanning = true;

let requestRunning = false;


/* =====================================================
   เปิดกล้อง
   ===================================================== */

function startScanner() {

  if (scannerStarted) {
    return;
  }


  const button =
    document.getElementById("startButton");


  button.disabled = true;

  button.innerText =
    "⏳ กำลังเปิดกล้อง...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scannerStarted = true;

    scanning = true;

    requestRunning = false;


    button.innerText =
      "📷 กล้องกำลังทำงาน";


    document.getElementById(
      "result"
    ).innerHTML =
      "📷 พร้อมสแกนบัตร";

  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );


    button.disabled = false;

    button.innerText =
      "📷 เปิดกล้อง";


    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='error'>" +

      "<h3>❌ เปิดกล้องไม่ได้</h3>" +

      "<p>" +

      escapeHtml(error) +

      "</p>" +

      "</div>";

  });

}


/* =====================================================
   เมื่อสแกน QR สำเร็จ
   ===================================================== */

function onScanSuccess(decodedText) {


  if (!scanning || requestRunning) {
    return;
  }


  scanning = false;

  requestRunning = true;


  document.getElementById(
    "result"
  ).innerHTML =

    "<div class='loading'>" +

    "⏳ กำลังตรวจสอบ Ticket..." +

    "</div>";


  /* ===================================================
     อ่านข้อมูล QR
     =================================================== */

  let ticketID =
    String(decodedText || "").trim();


  const match =
    ticketID.match(
      /Ticket ID:\s*([A-Za-z0-9_-]+)/
    );


  if (match) {

    ticketID =
      match[1];

  }


  console.log(
    "QR:",
    decodedText
  );


  console.log(
    "Ticket ID:",
    ticketID
  );


  if (!ticketID) {

    requestRunning = false;

    showError(
      "ไม่พบ Ticket ID ใน QR Code"
    );

    resetScanner();

    return;

  }


  /* ===================================================
     เรียก Apps Script ด้วย JSONP
     =================================================== */

  callAppsScript(ticketID);

}


/* =====================================================
   เรียก Apps Script
   ===================================================== */

function callAppsScript(ticketID) {


  const callbackName =
    "checkIn_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  let finished = false;


  /* ===================================================
     ฟังก์ชันรับผลลัพธ์
     =================================================== */

  window[callbackName] =
    function(result) {


      if (finished) {
        return;
      }


      finished = true;


      console.log(
        "Apps Script Result:",
        result
      );


      cleanup();


      showResult(result);


      setTimeout(
        function() {

          resetScanner();

        },
        3000
      );

    };


  /* ===================================================
     สร้าง Script Request
     =================================================== */

  const script =
    document.createElement("script");


  script.async = true;


  script.src =
    API_URL +

    "?ticketID=" +

    encodeURIComponent(ticketID) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  /* ===================================================
     ถ้า Script โหลดไม่ได้
     =================================================== */

  script.onerror =
    function() {


      if (finished) {
        return;
      }


      finished = true;


      console.error(
        "Apps Script connection error"
      );


      cleanup();


      showError(
        "ไม่สามารถเชื่อมต่อ Google Apps Script ได้"
      );


      setTimeout(
        function() {

          resetScanner();

        },
        3000
      );

    };


  /* ===================================================
     Timeout
     ป้องกันค้างตลอด
     =================================================== */

  const timeout =
    setTimeout(
      function() {


        if (finished) {
          return;
        }


        finished = true;


        console.error(
          "Apps Script timeout"
        );


        cleanup();


        showError(
          "ระบบตอบกลับช้าเกินไป กรุณาลองสแกนอีกครั้ง"
        );


        setTimeout(
          function() {

            resetScanner();

          },
          3000
        );


      },
      10000
    );


  /* ===================================================
     Cleanup
     =================================================== */

  function cleanup() {

    clearTimeout(timeout);


    delete window[callbackName];


    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  document.body.appendChild(
    script
  );

}


/* =====================================================
   แสดงผล
   ===================================================== */

function showResult(result) {


  if (!result) {

    showError(
      "ไม่ได้รับข้อมูลจาก Apps Script"
    );

    return;

  }


  /* ===================================================
     สำเร็จ
     =================================================== */

  if (result.success) {

    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='success'>" +

      "<h2>✅ CHECK-IN สำเร็จ</h2>" +

      "<p><b>Ticket:</b> " +

      escapeHtml(
        result.ticketID
      ) +

      "</p>" +

      "<p><b>Order:</b> " +

      escapeHtml(
        result.orderID
      ) +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      escapeHtml(
        result.customer
      ) +

      "</p>" +

      "<p><b>Zone:</b> " +

      escapeHtml(
        result.zone
      ) +

      "</p>" +

      "<p><b>ประเภท:</b> " +

      escapeHtml(
        result.ticketType
      ) +

      "</p>" +

      "</div>";

    return;

  }


  /* ===================================================
     ใช้ไปแล้ว
     =================================================== */

  if (result.alreadyUsed) {

    document.getElementById(
      "result"
    ).innerHTML =

      "<div class='warning'>" +

      "<h2>⚠️ ใช้บัตรไปแล้ว</h2>" +

      "<p><b>Ticket:</b> " +

      escapeHtml(
        result.ticketID
      ) +

      "</p>" +

      "<p><b>Order:</b> " +

      escapeHtml(
        result.orderID
      ) +

      "</p>" +

      "<p><b>ชื่อ:</b> " +

      escapeHtml(
        result.customer
      ) +

      "</p>" +

      "<p><b>Zone:</b> " +

      escapeHtml(
        result.zone
      ) +

      "</p>" +

      "<p>" +

      escapeHtml(
        result.message
      ) +

      "</p>" +

      "</div>";

    return;

  }


  /* ===================================================
     ไม่พบ Ticket
     =================================================== */

  showError(
    result.message ||
    "ไม่พบ Ticket ในระบบ"
  );

}


/* =====================================================
   แสดง Error
   ===================================================== */

function showError(message) {

  document.getElementById(
    "result"
  ).innerHTML =

    "<div class='error'>" +

    "<h2>❌ เกิดข้อผิดพลาด</h2>" +

    "<p>" +

    escapeHtml(message) +

    "</p>" +

    "</div>";

}


/* =====================================================
   Reset เพื่อสแกนใบถัดไป
   ===================================================== */

function resetScanner() {

  scanning = true;

  requestRunning = false;


  document.getElementById(
    "result"
  ).innerHTML =
    "📷 พร้อมสแกนบัตรใบถัดไป";

}


/* =====================================================
   ป้องกัน HTML Injection
   ===================================================== */

function escapeHtml(value) {

  return String(
    value == null ? "" : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   QR Scan Failure
   ===================================================== */

function onScanFailure(error) {

  // ไม่ต้องแสดงอะไร

}


</script>

</body>

</html>
